apiVersion: projections.flanksource.com/v1alpha1
kind: Projection
metadata:
  name: api-facts
spec:
  source:
    query:
      http:
        url: https://api.example.com/inventory/{{.id}}
        method: GET
        bearer:
          value: $(INVENTORY_TOKEN)
        select: $.data
        accepted:
          attempts: 5
          wait: 2s
  target:
    path: target.yaml
    select: $.entries[*]
    filter: target.active
    create: false
  match:
    - source.id == target.id
  set:
    $.state:
      value: source.body.state
