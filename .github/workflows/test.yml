name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: read-all

env:
  DEPS_START_VERSION: v1.0.39

jobs:
  # One invocation for the whole repo. Gavel discovers every project root, so a
  # single run covers the root module, the cmd/query module, and the www vitest
  # suite; splitting per module would just run cmd/query twice.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # pull-requests/issues are for the sticky comment; the gavel action posts it
    # through /issues/{n}/comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/query/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # cmd/query/www/embed.go go:embeds dist/, so the bundle has to exist before
      # anything in that module compiles.
      - name: Build the web UI
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@10.20.0 --activate
          pnpm --dir cmd/query/www install --frozen-lockfile
          pnpm --dir cmd/query/www build

      - name: Install deps-start
        run: |
          set -euo pipefail
          mkdir -p .tmp "$HOME/.local/bin"
          base="https://github.com/flanksource/deps/releases/download/${DEPS_START_VERSION}"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64 "$base/deps-start-linux-amd64"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64.sha256 "$base/deps-start-linux-amd64.sha256"
          (cd .tmp && sha256sum --check deps-start-linux-amd64.sha256)
          install -m 0755 .tmp/deps-start-linux-amd64 "$HOME/.local/bin/deps-start"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # COMMONS_DB_URL names the maintenance database; COMMONS_DB_CREATE defaults
      # to true, so each test carves out and drops its own database on this server.
      - name: Start postgres
        run: |
          set -euo pipefail
          url=$(deps-start postgres@16 --runtime binary -o json --wait-timeout 5m \
            | jq -er '.connection.url')
          echo "::add-mask::$url"
          echo "COMMONS_DB_URL=$url" >> "$GITHUB_ENV"

      # ./e2e is owned by e2e.yml, which also provisions opensearch and valkey.
      - name: Test with gavel
        uses: flanksource/gavel@43a9189b99e71ed928f418e01cd34aa797c2c0e0 # v0.0.54
        with:
          args: test --ignore ./e2e --timeout 25m --test-timeout 10m
          artifact-name: gavel-test
          comment-header: gavel-test
          # GITHUB_TOKEN is read-only on fork PRs, so the sticky comment would fail.
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"

      - name: Stop services
        if: always()
        run: deps-start stop --all || true

  # Same multi-root discovery: golangci-lint runs once per discovered go.mod (so
  # . and cmd/query) and tsc anchors at the nearest tsconfig.json. No database —
  # linters do not touch one.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/query/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # tsc and eslint need node_modules, but not the built bundle.
      - name: Install web dependencies
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@10.20.0 --activate
          pnpm --dir cmd/query/www install --frozen-lockfile

      - name: Lint with gavel
        uses: flanksource/gavel@43a9189b99e71ed928f418e01cd34aa797c2c0e0 # v0.0.54
        with:
          args: lint --timeout 10m
          artifact-name: gavel-lint
          comment-header: gavel-lint
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
