name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: read-all

env:
  DEPS_START_VERSION: v1.0.42

jobs:
  # One invocation for the whole repo. Gavel discovers every project root, so a
  # single run covers the root, recordstore, tracing and cmd/query
  # modules, and the www vitest suite; splitting per module would just run
  # cmd/query twice.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # pull-requests/issues are for the sticky comment; the gavel action posts it
    # through /issues/{n}/comments.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            recordstore/go.sum
            tracing/go.sum
            cmd/query/go.sum

      - name: Configure Go workspace
        run: go work init . ./recordstore ./tracing ./cmd/query

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # cmd/query/www/embed.go go:embeds dist/, so the bundle has to exist before
      # anything in that module compiles.
      - name: Build the web UI
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@11.22.0 --activate
          pnpm --dir cmd/query/www install --frozen-lockfile
          pnpm --dir cmd/query/www build

      - name: Install deps-start
        run: |
          set -euo pipefail
          mkdir -p .tmp "$HOME/.local/bin"
          base="https://github.com/flanksource/deps/releases/download/${DEPS_START_VERSION}"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64.tar.gz "$base/deps-start-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64.tar.gz.sha256 "$base/deps-start-linux-amd64.tar.gz.sha256"
          (cd .tmp && sha256sum --check deps-start-linux-amd64.tar.gz.sha256)
          tar -xzf .tmp/deps-start-linux-amd64.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # COMMONS_DB_URL names the maintenance database; COMMONS_DB_CREATE defaults
      # to true, so each test carves out and drops its own database on this server.
      # Docker rather than binary: the binary runtime resolves its version against
      # Maven Central (zonky embedded-postgres-binaries), which rate-limits CI with
      # HTTP 429. The docker runtime pulls postgres:16 and never touches Maven.
      - name: Start postgres
        run: |
          set -euo pipefail
          url=$(deps-start postgres@16 --runtime docker -o json --wait-timeout 5m \
            | jq -er '.connection.url')
          echo "::add-mask::$url"
          echo "COMMONS_DB_URL=$url" >> "$GITHUB_ENV"

      # The fs and connection storage tests skip unless these name a server.
      # adobe/s3mock stands in for S3 (MinIO's images can no longer be pulled
      # anonymously), fake-gcs-server for GCS, and Samba for SMB. SFTP runs
      # against an in-process server and needs nothing here.
      - name: Start storage servers
        run: |
          set -euo pipefail
          docker run -d --name test-s3 -p 127.0.0.1:19090:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=commons-db-test adobe/s3mock:4.7.0
          docker run -d --name test-gcs -p 127.0.0.1:14443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -backend memory -public-host 127.0.0.1:14443
          docker run -d --name test-smb -p 127.0.0.1:1445:445 \
            -e NAME=Data -e USER=samba -e PASS=secret dockurr/samba:4.21
          wait_for() {
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "timed out waiting for: $*" >&2
            return 1
          }
          wait_for curl -sf http://127.0.0.1:19090/
          wait_for curl -sf http://127.0.0.1:14443/storage/v1/b
          wait_for bash -c 'exec 3<>/dev/tcp/127.0.0.1/1445'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"name":"commons-db-test"}' \
            "http://127.0.0.1:14443/storage/v1/b?project=test" >/dev/null
          {
            echo "COMMONS_DB_S3_TEST_ENDPOINT=http://127.0.0.1:19090"
            echo "COMMONS_DB_GCS_TEST_ENDPOINT=http://127.0.0.1:14443/storage/v1/"
            echo "COMMONS_DB_SMB_TEST_SERVER=127.0.0.1:1445"
          } >> "$GITHUB_ENV"

      # ./e2e is owned by e2e.yml, which also provisions opensearch and valkey.
      # gavel auto-runs -bench=. for packages whose plain go test files hold only
      # Benchmark* funcs; recordstore/recordresults is one, and its matrix (datasets
      # up to 1 GiB per backend) cannot fit --test-timeout. --bench=^$ still
      # compiles the benchmarks but runs none; --bench=false would instead re-run
      # that package's ginkgo suite under plain go test.
      - name: Test with gavel
        uses: flanksource/gavel@43a9189b99e71ed928f418e01cd34aa797c2c0e0 # v0.0.54
        with:
          args: test --ignore ./e2e --bench=^$ --timeout 25m --test-timeout 10m
          artifact-name: gavel-test
          comment-header: gavel-test
          # GITHUB_TOKEN is read-only on fork PRs, so the sticky comment would fail.
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"

      - name: Stop services
        if: always()
        run: |
          deps-start stop --all || true
          docker rm -f test-s3 test-gcs test-smb || true

  # Same multi-root discovery: golangci-lint runs once per discovered go.mod (so
  # ., recordstore, tracing and cmd/query) and tsc anchors at the nearest tsconfig.json. No database —
  # linters do not touch one.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            recordstore/go.sum
            tracing/go.sum
            cmd/query/go.sum

      - name: Configure Go workspace
        run: go work init . ./recordstore ./tracing ./cmd/query

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # tsc and eslint need node_modules, but not the built bundle.
      - name: Install web dependencies
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@11.22.0 --activate
          pnpm --dir cmd/query/www install --frozen-lockfile

      # Each module must tidy on its own, the way a consumer resolves it, so the
      # check runs without the workspace.
      - name: Check go.mod files are tidy
        run: make tidy-check

      - name: Lint with gavel
        uses: flanksource/gavel@43a9189b99e71ed928f418e01cd34aa797c2c0e0 # v0.0.54
        with:
          args: lint --timeout 10m
          artifact-name: gavel-lint
          comment-header: gavel-lint
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
