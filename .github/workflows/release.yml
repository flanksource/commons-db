name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the module alignment commit so the workflow doesn't loop on itself.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    steps:
      # Authenticate as a GitHub App so the release commit can be pushed to the
      # protected main branch. The App must be on the branch ruleset's bypass list
      # (the default GITHUB_TOKEN is subject to the ruleset and cannot bypass it).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FLANKSOURCE_APP_ID }}
          private-key: ${{ secrets.FLANKSOURCE_APP_SECRET }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate next version
        id: version
        uses: charlesthomas/github-action-svu@da0337f57ff7d77c58363c32e9f863bfb01c0098 # v1.1.4+3.2.3
        with:
          cmd: patch
          pushTag: false

      - name: Set up Go
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: "1.26"

      - name: Set up Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build the web UI
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          corepack enable pnpm
          corepack prepare pnpm@11.22.0 --activate
          pnpm --dir cmd/query/www install --frozen-lockfile
          pnpm --dir cmd/query/www build

      - name: Align and verify module requirements
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.next }}
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go test ./.github/scripts/release-modules
          go run ./.github/scripts/release-modules "$RELEASE_VERSION"
          make tidy
          make tidy-check
          go run ./.github/scripts/release-modules --check "$RELEASE_VERSION"
          git diff --check

      - name: Commit and publish the module release
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum recordstore/go.mod recordstore/go.sum tracing/go.mod tracing/go.sum cmd/query/go.mod cmd/query/go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): align modules for ${RELEASE_VERSION}"
          fi
          git tag "$RELEASE_VERSION"
          git tag "recordstore/$RELEASE_VERSION"
          git tag "tracing/$RELEASE_VERSION"
          git tag "cmd/query/$RELEASE_VERSION"
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}" \
            "refs/tags/recordstore/${RELEASE_VERSION}:refs/tags/recordstore/${RELEASE_VERSION}" \
            "refs/tags/tracing/${RELEASE_VERSION}:refs/tags/tracing/${RELEASE_VERSION}" \
            "refs/tags/cmd/query/${RELEASE_VERSION}:refs/tags/cmd/query/${RELEASE_VERSION}"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
