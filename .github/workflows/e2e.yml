name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.go"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**.go"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
      - "go.mod"
      - "go.sum"

permissions: read-all

env:
  DEPS_START_VERSION: v1.0.39

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Ubuntu only: opensearch publishes no darwin bundle, so its deps-start
    # binary runtime is linux-*.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.26"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install deps-start
        run: |
          set -euo pipefail
          mkdir -p .tmp "$HOME/.local/bin"
          base="https://github.com/flanksource/deps/releases/download/${DEPS_START_VERSION}"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64.tar.gz "$base/deps-start-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            -o .tmp/deps-start-linux-amd64.tar.gz.sha256 "$base/deps-start-linux-amd64.tar.gz.sha256"
          (cd .tmp && sha256sum --check deps-start-linux-amd64.tar.gz.sha256)
          tar -xzf .tmp/deps-start-linux-amd64.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # deps-start writes the JSON envelope to stdout and its status line to
      # stderr, so piping straight into jq is safe. The postgres and valkey URLs
      # carry a generated password and have to be masked.
      - name: Start services
        run: |
          set -euo pipefail
          pg=$(deps-start postgres@16 --runtime binary -o json --wait-timeout 5m \
            | jq -er '.connection.url')
          opensearch=$(deps-start opensearch --runtime binary -o json --wait-timeout 5m \
            | jq -er '.connection.url')
          # valkey has no binary runtime in deps; docker is preinstalled here.
          valkey=$(deps-start valkey --runtime docker -o json --wait-timeout 5m \
            | jq -er '.connection.url')
          echo "::add-mask::$pg"
          echo "::add-mask::$valkey"
          {
            echo "COMMONS_DB_URL=$pg"
            echo "OPENSEARCH_URL=$opensearch"
            echo "VALKEY_URL=$valkey"
          } >> "$GITHUB_ENV"

      - name: Test with gavel
        uses: flanksource/gavel@43a9189b99e71ed928f418e01cd34aa797c2c0e0 # v0.0.54
        with:
          args: test ./e2e --framework ginkgo --timeout 30m --test-timeout 10m
          artifact-name: gavel-e2e-${{ matrix.os }}
          comment-header: gavel-e2e
          # GITHUB_TOKEN is read-only on fork PRs, so the sticky comment would fail.
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"

      - name: Assert no scratch databases leaked
        if: always()
        run: |
          if [[ -z "${COMMONS_DB_URL:-}" ]]; then
            echo "COMMONS_DB_URL is unset because service startup did not complete"
            exit 0
          fi
          leaked=$(psql "$COMMONS_DB_URL" -tAc \
            "SELECT count(*) FROM pg_database
             WHERE left(datname, length('commons_db_test_')) = 'commons_db_test_'
                OR left(datname, length('commons_db_pool_')) = 'commons_db_pool_'")
          echo "leftover databases: $leaked"
          test "$leaked" -eq 0

      - name: Stop services
        if: always()
        run: deps-start stop --all || true
