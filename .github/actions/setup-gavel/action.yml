name: Set up pinned Gavel
description: Build the Gavel revision with isolated reporter imports and Ginkgo benchmark selection fixes.
runs:
  using: composite
  steps:
    - name: Check out Gavel
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: flanksource/gavel
        ref: 750fb67a05f93a3ad6728ffbef4d7bfc0e0faac6
        path: .tmp/gavel-source
        persist-credentials: false
    - name: Build Gavel
      shell: bash
      working-directory: .tmp/gavel-source
      env:
        GOWORK: off
      run: |
        make build
        echo "$PWD/.bin" >> "$GITHUB_PATH"
